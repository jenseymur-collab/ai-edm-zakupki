[project]
name = "ai-edm-backend"
version = "0.1.0"
description = "AI-EDM Закупки MVP — backend"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "fastapi>=0.115,<0.120",
    "uvicorn[standard]>=0.30,<0.40",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.29,<0.31",
    "alembic>=1.13,<2.0",
    "openai>=1.50,<2.0",
    "httpx>=0.27,<0.30",
    "structlog>=24.1,<25.0",
    "pgvector>=0.3,<0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.23,<0.25",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.6,<0.8",
    "tach>=0.10,<0.20",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["тесты"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["N802", "N803", "N806", "N815", "N816"]  # разрешаем кириллические идентификаторы

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
